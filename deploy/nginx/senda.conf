# Senda Sovereign Search Engine — Nginx Production Reverse Proxy

# Rate limiting zone: max 15 requests per second per IP (protects against abusive scraping)
limit_req_zone $binary_remote_addr zone=senda_search_limit:10m rate=15r/s;

# Sovereign Privacy: Discard client IP logging entirely
log_format sovereign_privacy '0.0.0.0 - - [$time_local] "$request" $status $body_bytes_sent "$http_referer"';

server {
    listen 80;
    listen [::]:80;
    server_name senda.ideh.top;

    # ACME Let's Encrypt challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name senda.ideh.top;

    # SSL/TLS Certificate configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/senda.ideh.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senda.ideh.top/privkey.pem;

    # Cryptographic hardening: TLS 1.2 and 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Sovereign Privacy Headers
    # Note: Content-Security-Policy and application headers are dynamically generated
    # by Senda with per-request cryptographic nonces to avoid double-CSP script blocking.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Zero IP logging to disk (anonymized format)
    access_log /var/log/nginx/senda_access.log sovereign_privacy;
    error_log /var/log/nginx/senda_error.log warn;

    # Static assets caching
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # OpenSearch auto-discovery XML
    location = /opensearch.xml {
        proxy_pass http://127.0.0.1:8000/opensearch.xml;
        proxy_set_header Host $host;
        expires 1d;
    }

    # Search & API endpoints
    location / {
        limit_req zone=senda_search_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "0.0.0.0";
        proxy_set_header X-Forwarded-For "0.0.0.0";
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
