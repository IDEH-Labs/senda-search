<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Deep Cosmic Dark Background -->
    <radialGradient id="og-bg" cx="50%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="55%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- Radiant Ambient Core -->
    <radialGradient id="og-ambient" cx="600" cy="180" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2a0" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <!-- S-Curve Vivid Gradient -->
    <linearGradient id="og-curve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="45%" stop-color="#00d2a0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter for the S-Curve -->
    <filter id="og-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="600" cy="180" r="320" fill="url(#og-ambient)"/>

  <!-- Centered Sovereign Hero Emblem (Scaled to 300px, centered at x=600, y=180) -->
  <g transform="translate(451, 31) scale(0.58)">
    <!-- Halo ring -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="#00d2a0" stroke-width="3.5" opacity="0.30"/>
    <!-- Orbital dashed telemetry ring -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="16 20" opacity="0.50"/>
    <!-- Senda S-Curve -->
    <path d="M 306 170 C 306 135 272 120 230 120 C 180 120 154 145 154 188 C 154 238 204 256 254 272 C 314 290 348 316 348 358 C 348 408 296 434 236 434 C 176 434 142 400 142 358"
          fill="none" stroke="url(#og-curve)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#og-glow)"/>
  </g>

  <!-- Brand Typography: Massive, Bold & High Contrast -->
  <text x="600" y="392" text-anchor="middle" fill="#020408" opacity="0.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Source Sans 3', 'Liberation Sans', sans-serif" font-size="96" font-weight="800" letter-spacing="-0.03em">Senda</text>
  <text x="600" y="388" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Source Sans 3', 'Liberation Sans', sans-serif" font-size="96" font-weight="800" letter-spacing="-0.03em">Senda</text>

  <!-- Subtitle: High legibility on mobile screens -->
  <text x="600" y="446" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Source Sans 3', 'Liberation Sans', sans-serif" font-size="32" font-weight="400" letter-spacing="-0.01em">Buscador web libre, soberano y sin rastreo</text>

  <!-- Feature Pills -->
  <g transform="translate(600, 506)" text-anchor="middle">
    <!-- Pill 1: Software Libre -->
    <rect x="-355" y="0" width="220" height="42" rx="21" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.4"/>
    <text x="-245" y="27" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="0.05em">SOFTWARE LIBRE</text>

    <!-- Pill 2: Cero Rastreo -->
    <rect x="-115" y="0" width="230" height="42" rx="21" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="0" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="0.05em">CERO RASTREO</text>

    <!-- Pill 3: Soberanía Digital -->
    <rect x="135" y="0" width="220" height="42" rx="21" fill="rgba(168,85,247,0.12)" stroke="#c084fc" stroke-width="1.4"/>
    <text x="245" y="27" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="0.05em">INDEPENDIENTE</text>
  </g>

  <!-- Subtle bottom domain label -->
  <text x="600" y="594" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="0.12em">SENDA.IDEH.TOP</text>
</svg>