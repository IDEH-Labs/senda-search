{% extends "base.html" %}

{% block content %}
<div class="hero-container">
    <div class="hero-brand-emblem" aria-hidden="true">
        <svg class="hero-logo" width="80" height="80" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="heroGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#10b981"/>
                    <stop offset="50%" stop-color="#06b6d4"/>
                    <stop offset="100%" stop-color="#3b82f6"/>
                </linearGradient>
                <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
            </defs>
            <circle cx="20" cy="20" r="18" stroke="url(#heroGrad)" stroke-width="2" fill="none" opacity="0.4"/>
            <path d="M20 3 L25 15 L37 20 L25 25 L20 37 L15 25 L3 20 L15 15 Z" fill="url(#heroGrad)" filter="url(#heroGlow)"/>
            <circle cx="20" cy="20" r="4" fill="#ffffff"/>
        </svg>
    </div>

    <h1 class="hero-title" data-i18n="hero_title">Senda</h1>
    <p class="hero-subtitle" data-i18n="hero_subtitle">
        Independent, ethical, and verifiable web search engine. Free software under GPL-3.0.
    </p>

    <!-- Category selector tabs -->
    <div class="category-tabs hero-tabs" role="tablist" aria-label="Search vertical selection">
        <button type="button" role="tab" aria-selected="true" class="category-tab active" data-cat="all" onclick="setCategory('all', this)">
            <span class="tab-icon">🌐</span>
            <span class="tab-label" data-i18n="tab_web">Web</span>
        </button>
        <button type="button" role="tab" aria-selected="false" class="category-tab" data-cat="news" onclick="setCategory('news', this)">
            <span class="tab-icon">📰</span>
            <span class="tab-label" data-i18n="tab_news">Noticias</span>
        </button>
        <button type="button" role="tab" aria-selected="false" class="category-tab" data-cat="images" onclick="setCategory('images', this)">
            <span class="tab-icon">🖼️</span>
            <span class="tab-label" data-i18n="tab_images">Imágenes</span>
        </button>
        <button type="button" role="tab" aria-selected="false" class="category-tab" data-cat="library" onclick="setCategory('library', this)">
            <span class="tab-icon">📚</span>
            <span class="tab-label" data-i18n="tab_library">Biblioteca</span>
        </button>
    </div>

    <!-- Main search form -->
    <form class="search-form hero-search-form" action="/search" method="get" role="search">
        <input type="hidden" name="category" id="search-category" value="all">
        
        <div class="search-input-wrapper">
            <span class="search-icon-adornment" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>

            <input
                type="text"
                name="q"
                id="search-input"
                class="search-input"
                placeholder="Explore the sovereign web..."
                data-i18n="search_placeholder"
                required
                autofocus
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                aria-label="Search query"
            >

            <button type="button" id="clearSearchBtn" class="clear-btn" aria-label="Clear query" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <span class="kbd-shortcut" title="Press '/' to focus search input">/</span>

            <button type="submit" class="search-button" data-i18n="search_btn">Search</button>
        </div>
    </form>

    <noscript>
        <div class="noscript-banner">
            <p><strong>GNU LibreJS:</strong> Senda está diseñado para funcionar al 100% sin JavaScript. El formulario funciona mediante estándares web HTTP GET.</p>
        </div>
    </noscript>

    <div class="privacy-pills" role="region" aria-label="Privacy commitments">
        <div class="privacy-pill">
            <svg class="pill-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span class="pill-text" data-i18n="pill_no_logs">Zero Query Logs</span>
        </div>
        <div class="privacy-pill">
            <svg class="pill-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <span class="pill-text" data-i18n="pill_no_tracking">Zero Profiling</span>
        </div>
        <div class="privacy-pill">
            <svg class="pill-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="m4.93 4.93 14.14 14.14"></path></svg>
            <span class="pill-text" data-i18n="pill_no_cookies">Zero Cookies</span>
        </div>
        <div class="privacy-pill">
            <svg class="pill-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"></path></svg>
            <span class="pill-text" data-i18n="pill_fsf">100% Free Software</span>
        </div>
    </div>
</div>
{% endblock %}
