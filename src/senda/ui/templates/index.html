{% extends "base.html" %}

{% block body_class %}homepage-view{% endblock %}

{% block content %}
<div class="home-container">
    <div class="home-emblem-wrap">
        <svg class="home-emblem" width="84" height="84" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <linearGradient id="heroCurveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#2dd4bf"/>
                    <stop offset="50%" stop-color="#00d2a0"/>
                    <stop offset="100%" stop-color="#38bdf8"/>
                </linearGradient>
                <radialGradient id="heroHalo" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#00d2a0" stop-opacity="0.30"/>
                    <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.12"/>
                    <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
                </radialGradient>
                <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="10" result="blur"/>
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
            </defs>
            <!-- Ambient Halo -->
            <circle cx="256" cy="256" r="165" fill="url(#heroHalo)"/>
            <!-- Orbital Accent Rings -->
            <circle cx="256" cy="256" r="148" fill="none" stroke="#00d2a0" stroke-width="3" opacity="0.35"/>
            <circle cx="256" cy="256" r="148" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="14 18" opacity="0.45"/>
            <!-- Senda S-Curve -->
            <path d="M 306 170 C 306 135 272 120 230 120 C 180 120 154 145 154 188 C 154 238 204 256 254 272 C 314 290 348 316 348 358 C 348 408 296 434 236 434 C 176 434 142 400 142 358"
                  fill="none" stroke="url(#heroCurveGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#heroGlow)"/>
        </svg>
        <h1 class="home-brand-title">Senda</h1>
    </div>

    <!-- Linear / Raycast Style Search Command Bar -->
    <form class="home-search-form" action="/search" method="get" role="search">
        <input type="hidden" name="category" id="search-category" value="all">
        <input type="hidden" name="theme" id="search-theme" value="{{ theme | default('dark') }}">
        <input type="hidden" name="region" id="search-region" value="all">
        <input type="hidden" name="safe_search" id="search-safesearch" value="off">
        {% if lang %}<input type="hidden" name="lang" id="search-lang" value="{{ lang }}">{% endif %}
        
        <div class="command-bar">
            <span class="command-bar-icon" aria-hidden="true">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>

            <input
                type="text"
                name="q"
                id="search-input"
                class="command-bar-input"
                placeholder="{{ tr.search_placeholder | default('Buscar en la web libre...') }}"
                data-i18n="search_placeholder"
                required
                autofocus
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                aria-label="{{ tr.search_placeholder | default('Buscar') }}"
            >

            <button type="button" id="clearSearchBtn" class="command-bar-clear" aria-label="Limpiar" style="display: none;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <kbd class="command-shortcut" title="Presiona '/' para buscar">/</kbd>
        </div>

        <!-- Sleek Minimalist Category Navigation -->
        <div class="home-category-row" role="tablist" aria-label="Categorías">
            <button type="button" role="tab" class="cat-chip active" data-cat="all">
                <span data-i18n="tab_web">{{ tr.tab_web | default('Web') }}</span>
            </button>
            <button type="button" role="tab" class="cat-chip" data-cat="images">
                <span data-i18n="tab_images">{{ tr.tab_images | default('Imágenes') }}</span>
            </button>
            <button type="button" role="tab" class="cat-chip" data-cat="news">
                <span data-i18n="tab_news">{{ tr.tab_news | default('Noticias') }}</span>
            </button>
            <button type="button" role="tab" class="cat-chip" data-cat="library">
                <span data-i18n="tab_library">{{ tr.tab_library | default('Biblioteca') }}</span>
            </button>
        </div>
    </form>
</div>
{% endblock %}
