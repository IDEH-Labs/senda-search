{% extends "base.html" %}

{% block body_class %}homepage-view{% endblock %}
{% block header_brand %}{% endblock %}

{% block content %}
<div class="home-center">
    <div class="home-hero">
        <svg class="home-logo" width="44" height="44" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.6" opacity="0.25"/>
            <path d="M16 4 L19.5 12.5 L28 16 L19.5 19.5 L16 28 L12.5 19.5 L4 16 L12.5 12.5 Z" fill="currentColor"/>
        </svg>
        <h1 class="home-title">Senda</h1>
    </div>

    <form class="home-search-form" action="/search" method="get" role="search">
        <input type="hidden" name="category" value="all">
        <div class="search-box">
            <span class="search-box-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
            <input
                type="text"
                name="q"
                id="search-input"
                class="search-box-input"
                placeholder="Buscar en la web libre..."
                data-i18n="search_placeholder"
                required
                autofocus
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                aria-label="Buscar"
            >
            <button type="button" id="clearSearchBtn" class="search-clear-btn" aria-label="Limpiar" style="display: none;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="home-actions">
            <button type="submit" class="home-btn" data-i18n="search_btn">Buscar con Senda</button>
            <button type="button" class="home-btn home-btn-subtle" onclick="exploreLibreWeb()" data-i18n="lucky_btn">Explorar la red libre</button>
        </div>
    </form>
</div>

<script>
    // @license magnet:?xt=urn:btih:1f739d935de45e38526949e2bee45099c10f745f&dn=gpl-3.0.txt GPL-v3.0-or-later
    function exploreLibreWeb() {
        var topics = ['Debian', 'Free Software', 'Linux', 'Wikipedia', 'KDE', 'Alpine Linux', 'GPL', 'LibrePlanet'];
        var chosen = topics[Math.floor(Math.random() * topics.length)];
        var input = document.getElementById('search-input');
        if (input) {
            input.value = chosen;
            input.form.submit();
        }
    }
    // @license-end
</script>
{% endblock %}
