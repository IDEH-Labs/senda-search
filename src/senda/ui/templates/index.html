{% extends "base.html" %}

{% block content %}
<div class="hero-container">
    <div class="hero-brand-emblem" aria-hidden="true">
        <svg class="hero-logo" width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
            <path d="M16 3 L19.5 12.5 L29 16 L19.5 19.5 L16 29 L12.5 19.5 L3 16 L12.5 12.5 Z" fill="currentColor"/>
            <circle cx="16" cy="16" r="2.5" fill="var(--bg-surface)"/>
        </svg>
    </div>

    <h1 class="hero-title" data-i18n="hero_title">Senda</h1>
    <p class="hero-subtitle" data-i18n="hero_subtitle">
        Buscador libre, ético y sin rastreo para la web abierta.
    </p>

    <!-- Category selector tabs -->
    <div class="category-tabs hero-tabs" role="tablist" aria-label="Categorías de búsqueda">
        <button type="button" role="tab" aria-selected="true" class="category-tab active" data-cat="all" onclick="setCategory('all', this)">
            <span class="tab-label" data-i18n="tab_web">Web</span>
        </button>
        <button type="button" role="tab" aria-selected="false" class="category-tab" data-cat="news" onclick="setCategory('news', this)">
            <span class="tab-label" data-i18n="tab_news">Noticias</span>
        </button>
        <button type="button" role="tab" aria-selected="false" class="category-tab" data-cat="images" onclick="setCategory('images', this)">
            <span class="tab-label" data-i18n="tab_images">Imágenes</span>
        </button>
        <button type="button" role="tab" aria-selected="false" class="category-tab" data-cat="library" onclick="setCategory('library', this)">
            <span class="tab-label" data-i18n="tab_library">Biblioteca</span>
        </button>
    </div>

    <!-- Main search form -->
    <form class="search-form hero-search-form" action="/search" method="get" role="search">
        <input type="hidden" name="category" id="search-category" value="all">
        
        <div class="search-input-wrapper">
            <span class="search-icon-adornment" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>

            <input
                type="text"
                name="q"
                id="search-input"
                class="search-input"
                placeholder="Escribe para buscar..."
                data-i18n="search_placeholder"
                required
                autofocus
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                aria-label="Términos de búsqueda"
            >

            <button type="button" id="clearSearchBtn" class="clear-btn" aria-label="Limpiar búsqueda" style="display: none;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <span class="kbd-shortcut" title="Presiona '/' para buscar">/</span>

            <button type="submit" class="search-button" data-i18n="search_btn">Buscar</button>
        </div>
    </form>

    <noscript>
        <div class="noscript-banner">
            <p><strong>GNU LibreJS:</strong> Senda funciona al 100% sin JavaScript mediante estándares HTTP GET puros.</p>
        </div>
    </noscript>

    <div class="privacy-pills" role="region" aria-label="Principios éticos">
        <div class="privacy-pill">
            <svg class="pill-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span class="pill-text" data-i18n="pill_no_logs">Cero Registros</span>
        </div>
        <div class="privacy-pill">
            <svg class="pill-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <span class="pill-text" data-i18n="pill_no_tracking">Cero Rastreo</span>
        </div>
        <div class="privacy-pill">
            <svg class="pill-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="m4.93 4.93 14.14 14.14"></path></svg>
            <span class="pill-text" data-i18n="pill_no_cookies">Cero Cookies</span>
        </div>
        <div class="privacy-pill">
            <svg class="pill-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"></path></svg>
            <span class="pill-text" data-i18n="pill_fsf">Software Libre</span>
        </div>
    </div>
</div>
{% endblock %}
