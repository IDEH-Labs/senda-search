<html lang="en" data-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Senda — Minimalist, ethical, and libre web search engine with zero query logs and zero profiling.">
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)">
    
    <link rel="search" type="application/opensearchdescription+xml" href="/opensearch.xml" title="Senda">
    <link rel="jslicense" href="/javascript">
    
    <title>{% block title %}Senda — Buscador Libre{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/senda.css">
    
    <script>
        // @license magnet:?xt=urn:btih:1f739d935de45e38526949e2bee45099c10f745f&dn=gpl-3.0.txt GPL-v3.0-or-later
        (function() {
            try {
                var saved = localStorage.getItem('senda_theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                } else {
                    document.documentElement.setAttribute('data-theme', 'auto');
                }
            } catch(e) {}
        })();
        // @license-end
    </script>
</head>
<body>
    <a href="#main-content" class="skip-link" data-i18n="skip_to_content">Skip to content</a>

    <header class="app-header" role="banner">
        <a href="/" class="brand" aria-label="Senda Home">
            <svg class="brand-logo" width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.8" opacity="0.35"/>
                <path d="M16 4 L19.5 12.5 L28 16 L19.5 19.5 L16 28 L12.5 19.5 L4 16 L12.5 12.5 Z" fill="currentColor"/>
                <circle cx="16" cy="16" r="2.5" fill="var(--bg-surface)"/>
            </svg>
            <span class="brand-text">Senda</span>
        </a>

        <nav class="main-nav" role="navigation" aria-label="Main Navigation">
            <a href="/" class="nav-link" data-i18n="nav_home">Search</a>
            <a href="/about" class="nav-link" data-i18n="nav_about">About</a>
            <a href="/privacy" class="nav-link" data-i18n="nav_privacy">Privacy</a>
            
            <div class="header-controls">
                <!-- Theme Switcher -->
                <button type="button" id="themeToggle" class="control-btn theme-toggle" aria-label="Toggle color theme" title="Cambiar tema (Claro / Oscuro / Auto)">
                    <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2"></path><path d="M12 20v2"></path>
                        <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
                        <path d="M2 12h2"></path><path d="M20 12h2"></path>
                        <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
                    </svg>
                    <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                    </svg>
                </button>

                <!-- Language Selector -->
                <div class="lang-selector-wrapper">
                    <select id="langSelector" class="lang-select" aria-label="Select Language">
                        <option value="es">Español</option>
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="pt">Português</option>
                        <option value="it">Italiano</option>
                        <option value="ja">日本語</option>
                        <option value="zh">简体中文</option>
                    </select>
                </div>
            </div>
        </nav>
    </header>

    <main id="main-content" class="content-area" role="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer" role="contentinfo">
        <div class="footer-content">
            <div class="footer-meta">
                <span data-i18n="footer_text">Senda es software libre bajo la licencia GNU GPL-3.0-o-posterior.</span>
                <span class="footer-sep">&bull;</span>
                <a href="https://ideh.top" target="_blank" rel="noopener noreferrer">IDEH Labs</a>
                <span class="footer-sep">&bull;</span>
                <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener noreferrer">GPLv3+</a>
                <span class="footer-sep">&bull;</span>
                <a href="/javascript" rel="jslicense">LibreJS Web Labels</a>
            </div>
            <div class="footer-forges">
                <a href="https://codeberg.org/IDEH-Labs/senda-search" target="_blank" rel="noopener noreferrer" class="forge-link" title="Codeberg Libre Forge">Codeberg</a>
                <span class="footer-sep">&bull;</span>
                <a href="https://gitlab.com/ideh-labs/senda-search" target="_blank" rel="noopener noreferrer" class="forge-link" title="GitLab Mirror">GitLab</a>
                <span class="footer-sep">&bull;</span>
                <a href="https://github.com/IDEH-Labs/senda-search" target="_blank" rel="noopener noreferrer" class="forge-link" title="GitHub Mirror">GitHub</a>
            </div>
        </div>
    </footer>

    <script src="/static/js/i18n.js"></script>
</body>
</html>
